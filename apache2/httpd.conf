ServerRoot "/usr/local/apache2"
Listen 80

# Essential Modules
LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule authn_core_module modules/mod_authn_core.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authz_host_module modules/mod_authz_host.so
LoadModule dir_module modules/mod_dir.so
LoadModule mime_module modules/mod_mime.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule alias_module modules/mod_alias.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so

# SSL Modules
LoadModule ssl_module modules/mod_ssl.so
LoadModule socache_shmcb_module modules/mod_socache_shmcb.so

User www-data
Group www-data

# Server Directory Rules
<Directory />
    AllowOverride none
    Require all denied
</Directory>

#activates when module is loaded
<IfModule dir_module>
    DirectoryIndex index.html
</IfModule>

#denias acces to .ht... files
<Files ".ht*">
    Require all denied
</Files>

#only saves warnings and similar stuff
LogLevel warn

#defines logging format
<IfModule log_config_module>
    LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" combined
</IfModule>


TypesConfig conf/mime.types

# VirtualHost HTTP (Port 80)
<VirtualHost *:80>
    ServerName threeoppossums.com
    ServerAlias www.threeoppossums.com

    DocumentRoot "/usr/local/apache2/htdocs"

    Alias /.well-known/acme-challenge/ /var/www/certbot/.well-known/acme-challenge/
    
    <Directory "/var/www/certbot">
        Options Indexes FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    <Directory "/usr/local/apache2/htdocs">
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^(.*)$ https://%{HTTP_HOST}$1 [R=302,L]

    ErrorLog logs/error.log
    CustomLog logs/access.log combined
</VirtualHost>

#VirtualHost HTTPS (Port 443)
Listen 443
<VirtualHost *:443>
    ServerName threeoppossums.com
    ServerAlias www.threeoppossums.com

    DocumentRoot "/usr/local/apache2/htdocs"

    SSLEngine on

    #public certificate
    SSLCertificateFile "/usr/local/apache2/conf/certs/live/threeoppossums.com/fullchain.pem" 
    #local certificate
    SSLCertificateKeyFile "/usr/local/apache2/conf/certs/live/threeoppossums.com/privkey.pem" 

    ProxyRequests Off
    ProxyPreserveHost On
    
    ProxyPass / http://homepage:3000/
    ProxyPassReverse / http://homepage:3000/

    ErrorLog logs/error.log
    CustomLog logs/access.log combined
</VirtualHost>
